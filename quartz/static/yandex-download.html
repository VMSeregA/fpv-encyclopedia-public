<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Скачивание файла</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #101312;
        --panel: #171d1b;
        --text: #edf7f4;
        --muted: #a7b9b3;
        --accent: #29d6c9;
        --danger: #ff766f;
        --border: #2c3935;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f7f6;
          --panel: #ffffff;
          --text: #17201d;
          --muted: #52625d;
          --accent: #008d82;
          --danger: #b42318;
          --border: #d7e0dd;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(680px, 100%);
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        padding: 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(24px, 4vw, 34px);
        line-height: 1.15;
        letter-spacing: 0;
      }

      p {
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.55;
      }

      code {
        display: block;
        margin-top: 16px;
        padding: 12px;
        overflow-wrap: anywhere;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        background: color-mix(in srgb, var(--bg) 78%, var(--panel));
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 14px;
      }

      a,
      button {
        color: var(--accent);
      }

      #manual-link[hidden] {
        display: none;
      }

      #manual-link {
        display: inline-flex;
        margin-top: 16px;
        font-weight: 700;
      }

      button {
        margin-top: 20px;
        min-height: 44px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: transparent;
        padding: 0 16px;
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      .error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Подготавливаю скачивание</h1>
      <p id="status">Готовлю безопасную ссылку на скачивание...</p>
      <code id="file-path"></code>
      <a id="manual-link" hidden>Скачать файл вручную</a>
      <button id="retry" type="button" hidden>Повторить</button>
      <p>
        Если скачивание не началось, открой исходную папку
        <a href="https://disk.yandex.ru/d/3yurdx5-APOkQQ" rel="noopener">ORANGE5beta4</a>.
      </p>
    </main>

    <script src="./yandex-download-page.js" defer></script>
  </body>
</html>
